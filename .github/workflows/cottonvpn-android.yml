name: CottonVPN Android (debug APK)

on:
  workflow_dispatch: {}
  push:
    branches: [dev]
    paths:
      - ".github/workflows/cottonvpn-android.yml"
      # бамп версии = релиз: правка VERSION запускает сборку и публикацию сама
      - "VERSION"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: "27.0.11718014"
      QT_VERSION: "6.10.3"
      QT_MODULES: "qtremoteobjects qt5compat qtimageformats qtshadertools"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift || true
          df -h | head -3

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install desktop Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtremoteobjects qt5compat qtimageformats qtshadertools"
          dir: ${{ runner.temp }}
          py7zrversion: "==0.22.*"

      - name: Install android arm64 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: "qtremoteobjects qt5compat qtimageformats qtshadertools"
          dir: ${{ runner.temp }}
          py7zrversion: "==0.22.*"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conan
        run: |
          pip install "conan==2.28.0"
          conan profile detect --force

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cottonvpn.keystore"

      - name: Version (SemVer из файла VERSION)
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build (arm64-v8a, release — signed with stable key)
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cottonvpn.keystore
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          COTTON_RELEASE_VERSION: "${{ steps.ver.outputs.version }}"
        run: |
          chmod +x deploy/build.sh
          deploy/build.sh -t android --abi arm64-v8a --sign --aab

      - name: Collect signed APK + AAB
        run: |
          mkdir -p out
          # подписанный release APK (не *-unsigned) — для прямой установки
          f=$(find deploy/build -path '*outputs/apk/release/*.apk' ! -iname '*unsigned*' | head -1)
          [ -z "$f" ] && f=$(find deploy/build -name '*.apk' ! -iname '*unsigned*' | head -1)
          echo "picked APK: $f"
          test -n "$f"
          cp "$f" out/CottonVPN-arm64.apk
          # подписанный release AAB — для загрузки в Google Play
          a=$(find deploy/build -path '*outputs/bundle/release/*.aab' ! -iname '*unsigned*' | head -1)
          [ -z "$a" ] && a=$(find deploy/build -name '*.aab' ! -iname '*unsigned*' | head -1)
          echo "picked AAB: $a"
          test -n "$a"
          cp "$a" out/CottonVPN-release.aab
          ls -la out

      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: cottonvpn-apk
          path: |
            out/CottonVPN-arm64.apk
            out/CottonVPN-release.aab
          if-no-files-found: error

      # Версия с суффиксом через дефис (1.4.3-rc1, 1.4.3-test) = ЧЕРНОВАЯ сборка:
      # публикуется как pre-release. Такие релизы не попадают в releases/latest, поэтому
      # ни ссылка «скачать последнюю версию», ни бот их не видят — можно катать правки
      # сколько нужно, не гоняя пользователям версии и уведомления. Убрал суффикс →
      # обычный релиз → бот спросит про рассылку. (Решение владельца 2026-08-11.)
      - name: Publish GitHub Release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          TAG="v$VER"
          NOTES_FILE=WHATSNEW.txt
          [ -f "$NOTES_FILE" ] || NOTES_FILE=/dev/null
          case "$VER" in
            *-*) CHANNEL="--prerelease"; TITLE="CottonVPN $VER (черновая)" ;;
            *)   CHANNEL="--latest";     TITLE="CottonVPN $VER" ;;
          esac
          echo "Publishing $TAG as ${CHANNEL#--}"
          gh release create "$TAG" out/CottonVPN-arm64.apk out/CottonVPN-release.aab \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            $CHANNEL \
          || { gh release upload "$TAG" out/CottonVPN-arm64.apk --clobber; gh release upload "$TAG" out/CottonVPN-release.aab --clobber; }

      - name: Ссылка на сборку
        run: |
          VER="${{ steps.ver.outputs.version }}"
          case "$VER" in
            *-*) echo "Черновая сборка: https://github.com/${{ github.repository }}/releases/tag/v$VER" ;;
            *)   echo "Релиз: https://github.com/${{ github.repository }}/releases/latest" ;;
          esac
