name: CottonVPN Android (debug APK)

on:
  workflow_dispatch: {}
  push:
    branches: [dev]
    paths:
      - ".github/workflows/cottonvpn-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: "27.0.11718014"
      QT_VERSION: "6.10.3"
      QT_MODULES: "qtremoteobjects qt5compat qtimageformats qtshadertools"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift || true
          df -h | head -3

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install desktop Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtremoteobjects qt5compat qtimageformats qtshadertools"
          dir: ${{ runner.temp }}
          py7zrversion: "==0.22.*"

      - name: Install android arm64 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: "qtremoteobjects qt5compat qtimageformats qtshadertools"
          dir: ${{ runner.temp }}
          py7zrversion: "==0.22.*"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conan
        run: |
          pip install "conan==2.28.0"
          conan profile detect --force

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cottonvpn.keystore"

      - name: Build (arm64-v8a, release — signed with stable key)
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cottonvpn.keystore
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x deploy/build.sh
          deploy/build.sh -t android --abi arm64-v8a --sign

      - name: Collect signed APK
        run: |
          mkdir -p out
          # подписанный release APK (не *-unsigned)
          f=$(find deploy/build -path '*outputs/apk/release/*.apk' ! -iname '*unsigned*' | head -1)
          [ -z "$f" ] && f=$(find deploy/build -name '*.apk' ! -iname '*unsigned*' | head -1)
          echo "picked APK: $f"
          test -n "$f"
          cp "$f" out/CottonVPN-arm64.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cottonvpn-apk
          path: out/CottonVPN-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub Release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/CottonVPN-arm64.apk \
            --title "CottonVPN 1.0.${{ github.run_number }}" \
            --notes "CottonVPN Android build ${{ github.run_number }}" \
            --latest \
          || gh release upload "$TAG" out/CottonVPN-arm64.apk --clobber
